name: quality-gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "release/**"

jobs:
  quality:
    name: Typecheck, lint, tests, E2E, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: true
      DEMO_ACCESS_CODE: "202607"
      NEXT_PUBLIC_SUPABASE_URL: ""
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      SUPABASE_GATEWAY_URL: ""
      SUPABASE_GATEWAY_TOKEN: ""
      OPENAI_API_KEY: "test-openai-key-not-used-in-ci"
      WORDPRESS_ENCRYPTION_KEY: "ci-wordpress-encryption-key-32-bytes"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test integrity guard
        run: npm run test:integrity

      - name: Unit and integration tests
        run: npm run test

      - name: External contract tests
        run: npm run test:contract

      - name: Coverage
        run: npm run test:coverage

      - name: Playwright E2E
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Ensure Playwright trace artifact directory exists
        if: always()
        run: |
          mkdir -p test-results
          printf "Playwright traces and screenshots are stored here when a test fails or captures them.\n" > test-results/ARTIFACT_NOTE.txt

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
